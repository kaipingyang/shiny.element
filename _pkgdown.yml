    desc: >
      Element's methods, the objects they need, and the data a component asks
      the server for.
    contents:
      - el_call
      - el_table_row
      - el_load_children

  - title: Escape hatches
    desc: >
      For anything the wrappers do not cover: build your own component the way
      this package builds its own, write raw Element tags, or update a Vue
      instance directly.
    contents:
      - el_widget
      - JS
      - el
      - template
      - update_vue_data
