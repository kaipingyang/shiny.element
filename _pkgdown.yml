    navbar: ~
    contents:
      - shiny.element
      - articles/design
      - articles/i18n
      - articles/migration
      - articles/theming
      - articles/dark-mode
      - articles/custom-defaults
      - articles/transitions
      - shiny
      - forms
      - dashboards
      - combinations
      - limitations
  - title: Components
    navbar: ~
    contents:
      - articles/components
      - starts_with("articles/components/")

reference:
