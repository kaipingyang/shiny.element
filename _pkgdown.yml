url: https://kaipingyang.github.io/shiny.element/

repo:
  home: https://github.com/kaipingyang/shiny.element/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, gallery, guides, reference, news]
  components:
    gallery:
      text: Components
      href: articles/components.html
    guides:
      text: Guides
      menu:
      - text: Forms
        href: articles/forms.html
      - text: Tables
        href: articles/tables.html
      - text: Navigation and feedback
        href: articles/navigation.html
      - text: -------
      - text: What works, and what does not
        href: articles/limitations.html

reference:
  - title: Getting started
    desc: Page wrappers that load Vue, Element UI and the package's own assets.
    contents:
      - el_page
      - use_element
      - element_ui_dependency
      - el_locale_dependency
      - el_layout_css_dependency
      - vue_handler_dependency
      - el_feedback_dependency

  - title: Inputs
    desc: >
      Each reports to the server as `input$<id>`, on load as well as on change.
    contents:
      - el_autocomplete
      - update_el_autocomplete
      - el_transfer
      - update_el_transfer
      - el_input
      - el_input_number
      - el_select
      - el_radio_group
      - el_checkbox_group
      - el_switch
      - el_slider
      - el_rate
      - el_date_picker
      - el_color_picker
      - el_cascader
      - el_upload
      - starts_with("update_el_input")
      - update_el_select
      - update_el_radio_group
      - update_el_checkbox_group
      - update_el_switch
      - update_el_slider
      - update_el_rate
      - update_el_date_picker
      - update_el_color_picker
      - update_el_cascader
      - update_el_upload
      - el_upload_clear
      - df_to_cascader_options

  - title: Forms
    desc: >
      The form owns its model, so validation runs in the browser and the whole
      form reports once on submit.
    contents:
      - el_form
      - el_form_field
      - el_rule
      - update_el_form
      - el_form_validate
      - el_form_reset
      - el_form_clear_validate

  - title: Display
    contents:
      - el_avatar
      - update_el_avatar
      - el_image
      - update_el_image
      - el_tooltip
      - update_el_tooltip
      - el_popover
      - update_el_popover
      - el_popconfirm
      - update_el_popconfirm
      - el_button
      - el_tag
      - el_alert
      - el_progress
      - el_badge
      - el_card
      - el_table
      - el_pagination
      - el_timeline
      - el_carousel
      - el_divider
      - el_link
      - el_icon
      - update_el_button
      - update_el_tag
      - update_el_alert
      - update_el_progress
      - update_el_table
      - update_el_pagination
      - update_el_timeline
      - update_el_carousel
      - el_table_config

  - title: Containers
    desc: >
      Rendered as markup rather than Vue instances, which is what lets them
      hold other components from this package.
    contents:
      - el_tabs
      - el_collapse
      - el_steps
      - el_dialog
      - el_drawer
      - el_container
      - el_header
      - el_aside
      - el_main
      - el_footer
      - el_row
      - el_col
      - update_el_tabs
      - update_el_collapse
      - update_el_steps
      - update_el_dialog
      - update_el_drawer

  - title: Navigation
    contents:
      - el_breadcrumb
      - update_el_breadcrumb
      - el_page_header
      - update_el_page_header
      - el_backtop
      - update_el_backtop
      - el_infinite_scroll
      - update_el_infinite_scroll
      - el_menu
      - el_tree
      - el_dropdown
      - update_el_menu
      - update_el_tree
      - update_el_dropdown
      - df_to_tree_data

  - title: Feedback
    desc: Called from the server; nothing to place in the UI.
    contents:
      - el_message_box
      - el_loading
      - el_loading_close
      - el_notification
      - el_message

  - title: Calendar
    contents:
      - el_calendar
      - update_el_calendar

  - title: Component methods
    desc: >
      Element documents methods as well as props -- clearSelection(),
      setCheckedKeys(), validate(). These are functions on the component, so
      update_el_*() cannot reach them.
    contents:
      - el_call

  - title: Escape hatches
    desc: >
      For anything the wrappers do not cover: build your own component the way
      this package builds its own, write raw Element tags, or update a Vue
      instance directly.
    contents:
      - el_widget
      - el
      - template
      - update_vue_component
      - update_vue_data
