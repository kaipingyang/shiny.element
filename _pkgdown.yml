      - el_steps
      - el_step
      - el_tabs
      - el_tab_pane
      - insert_el_tab
      - remove_el_tab

  - title: Feedback
    desc: >
      Messages, notifications, message boxes and loading masks are called from the server.
    contents:
      - el_alert
      - el_dialog
      - el_drawer
      - el_loading
      - el_loading_close
      - el_message
      - el_message_close
      - el_message_box
      - el_notification
      - el_notification_close
      - el_popconfirm
      - el_popover
      - el_tooltip

  - title: Others
    contents:
      - el_divider
      - el_watermark

  - title: From the server
    desc: >
      Element Plus's methods, the objects they need, the events a component reports, and the data a component asks the server for.
    contents:
      - call_el
      - el_events
      - el_table_row
      - el_load_children

  - title: Vue components of your own
    desc: >
      The layer the Element components are built on, usable on its own: Vue's
      options written in R, a component as a Shiny input, an output that keeps
      the user's state across renders, shared state, and the server's way in.
    contents:
      - vue_app
      - vue_component
      - vue_store
      - vue_output
      - render_vue_data
      - update_vue
      - call_vue
      - flush_vue
      - vue_answer

  - title: Escape hatches
    desc: >
      For anything the wrappers do not cover: build an Element component the way this package builds its own, or write raw Element Plus tags.
    contents:
      - el_widget
      - JS
      - el
      - template
