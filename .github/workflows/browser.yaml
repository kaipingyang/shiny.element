# The browser tests: each component mounted in a real Chromium, driven over
# the DevTools protocol, with Vue's development build asserting no warnings.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: browser.yaml

permissions: read-all

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::chromote, any::shinytest2, local::.
          needs: check

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Run the browser tests
        env:
          CHROMOTE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          pkgload::load_all(helpers = FALSE, quiet = TRUE)
          res <- testthat::test_dir(
            "tests/testthat",
            filter = "browser|shinytest2",
            reporter = testthat::ProgressReporter$new(show_praise = FALSE),
            load_package = "source",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}
