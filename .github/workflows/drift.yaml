# Files generated from Element Plus's sources must match what the generators
# write now: the API tables' JSON, the enumerated arguments, the Rd files.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: drift.yaml

permissions: read-all

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Element Plus 2.14.7, the bundled version
        run: git clone --depth 1 --branch 2.14.7 https://github.com/element-plus/element-plus .upstream/element-plus

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::roxygen2, local::.
          needs: drift

      - name: Regenerate
        run: |
          python tools/api-coverage.py --docs
          Rscript -e 'pkgload::load_all(quiet = TRUE); ns <- asNamespace("shiny.element"); f <- grep("^el_", getNamespaceExports(ns), value = TRUE); f <- Filter(function(x) is.function(ns[[x]]), f); jsonlite::write_json(lapply(setNames(f, f), function(x) names(formals(ns[[x]]))), "/tmp/elapi/formals.json")'
          Rscript tools/api-coverage.R
          python tools/api-coverage.py --write-api
          Rscript -e 'roxygen2::roxygenise()'

      - name: Nothing changed
        run: |
          git status --short
          git diff --stat --exit-code -- vignettes/articles/components/api.json man NAMESPACE
